name: Update Website

on:
  schedule:
    - cron: "0 1 * * 4"  # Runs every Thursday at 1:00 AM UTC (8:00 PM EST Wednesday)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory /__w/aislyn-best-seller/aislyn-best-seller

      - name: Fetch All Branches
        run: git fetch --all

      - name: Install R Dependencies
        run: |
          R -e 'install.packages("janitor", repos="http://cran.rstudio.com")'

      - name: Update website
        run: quarto publish gh-pages

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory /__w/aislyn-best-seller/aislyn-best-seller

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data-processed/bestsellers-combined.*
          git commit -m "Updated website" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
