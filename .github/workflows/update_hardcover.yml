name: Update Hardcover Bestsellers

on:
  schedule:
    - cron: "30 0 * * 4"  # Runs every Thursday at 12:30 AM UTC (7:30 PM EST Wednesday)
  workflow_dispatch:  # Allows manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up R
        uses: r-lib/actions/setup-r@v2

      - name: Cache R Packages
        uses: actions/cache@v3
        with:
          path: ~/.R/  # Cache location
          key: r-packages-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            r-packages-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          R -e 'install.packages(c("tidyverse", "rvest", "lubridate", "janitor", "readr"), dependencies=TRUE)'
          
      - name: List Files
        run: ls -R

      - name: Run Hardcover Scraper
        run: Rscript scripts/update_bestsellers_hardcover.R  # Ensure this script updates only new data

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data-processed/bestsellers-hardcover.*
          git commit -m "Updated hardcover bestsellers list"
          git push
        continue-on-error: true  # Avoid breaking if there's no new data
