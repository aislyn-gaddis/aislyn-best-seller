name: Update Combined Bestsellers

on:
  schedule:
    - cron: "45 0 * * 4"  # Runs every Thursday at 12:45 AM UTC (7:45 PM EST Wednesday)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Combined Scraper
        run: Rscript scripts/update_bestsellers_combined.R

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory /__w/aislyn-best-seller/aislyn-best-seller

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data-processed/bestsellers-combined.*
          git commit -m "Updated combined bestsellers list" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Quarto Site
        run: |
          quarto publish --no-prompt


