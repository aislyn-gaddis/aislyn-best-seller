name: Backfill Bestsellers

on:
  workflow_dispatch:   # Only runs when you click "Run workflow" in GitHub Actions

jobs:
  backfill:
    runs-on: ubuntu-latest
    container: rocker/tidyverse:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Backfill Script (Combined)
        run: Rscript scripts/backfill_combined.R

      - name: Run Backfill Script (Hardcover)
        run: Rscript scripts/backfill_hardcover.R

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory /__w/${{ github.repository }}/${{ github.repository }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data-processed/bestsellers-combined.*
          # If hardcover: git add data-processed/bestsellers-hardcover.*
          git commit -m "Backfilled missing bestsellers" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
